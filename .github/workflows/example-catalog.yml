name: Example catalog

on:
  pull_request:
    paths:
      - 'creator/tutorials/examples/**'
      - 'creator/tutorials/examples.md'
      - 'creator/SUMMARY.md'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/example-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'creator/tutorials/examples/**'
      - 'creator/tutorials/examples.md'
      - 'creator/SUMMARY.md'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/example-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:examples
